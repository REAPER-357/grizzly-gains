<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="icon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grizzly Gains</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --accent-hover: #e68900;
            --danger-color: #cf6679;
            --border-color: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 600px; margin: 0 auto; }
        h1, h2, h3 { color: #fff; margin-bottom: 12px; }
        button { background-color: var(--accent-color); color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 16px; }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #333; color: var(--text-color); }
        button.danger { background-color: var(--danger-color); color: #fff; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 16px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #aaa; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .row { display: flex; gap: 8px; align-items: center; }
        .set-box { background: #252525; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .badge { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: var(--accent-color); }
    </style>
</head>
<body>

<!-- PAGE 1: HOME / DASHBOARD -->
    <div id="page-1" class="page active">
        <header style="text-align: center; padding: 20px;">
            <img src="icon.png" alt="Grizzly Gains Emblem" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
            <p style="color: #aaa; font-size: 14px; margin-top: 5px;">Offline Weight Lifting Tracker</p>
        </header>
        <button onclick="goToPage(4)">Select Workout</button>
        <button class="secondary" onclick="goToPage(5)">Workout History</button>
        <button class="secondary" onclick="goToPage(6)">Exercise Progress Graph</button>
        <button class="secondary" onclick="goToPage(7)">Body Weight Tracker</button>
        <button class="secondary" onclick="goToPage(2)">Manage Workouts</button>
    </div>

<!-- PAGE 2: MANAGE WORKOUTS -->
<div id="page-2" class="page">
    <div class="header-flex">
        <h2>Manage Workouts</h2>
        <button class="secondary" style="width: auto; padding: 8px 12px; margin: 0;" onclick="goToPage(1)">Back</button>
    </div>
    <button onclick="openEditor(null)">+ Create New Workout</button>
    <div id="workout-list"></div>

    <!-- PASTE BACKUP SECTION HERE -->
    <div style="margin-top: 30px; padding: 15px; background: #1a1a1a; border-radius: 8px; text-align: center; border: 1px solid #333;">
        <h3 style="color: #fff; font-size: 15px; margin-bottom: 10px;">Data Backup & Restore</h3>
        <button onclick="exportData()" class="secondary" style="margin-bottom: 8px;">Export Workouts (.json)</button>
        <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">
        <button onclick="document.getElementById('importFile').click()" class="secondary">Import Workouts</button>
    </div>
</div>

    <!-- PAGE 3: CREATE / EDIT WORKOUT -->
    <div id="page-3" class="page">
        <h2 id="editor-title">Create Workout</h2>
        <label>Workout Name / Title</label>
        <input type="text" id="workout-name-input" placeholder="e.g., Upper A">
        
        <h3>Exercises (Max 10)</h3>
        <div id="exercise-inputs-container"></div>
        <button class="secondary" onclick="addExerciseInput()">+ Add Exercise</button>
        
        <button onclick="saveWorkout()">Save Workout</button>
        <button class="secondary" onclick="goToPage(2)">Cancel</button>
    </div>

    <!-- PAGE 4: ACTIVE WORKOUT SESSION -->
    <div id="page-4" class="page">
        <div class="header-flex">
            <h2 id="active-workout-title">Workout</h2>
            <button class="secondary" style="width: auto; padding: 8px 12px; margin: 0;" onclick="goToPage(1)">Home</button>
        </div>
        
        <label>Date</label>
        <input type="date" id="session-date">

        <div id="active-exercises-container"></div>

        <label>Notes</label>
        <textarea id="session-notes" rows="3" placeholder="How did it feel today?"></textarea>

        <button onclick="exportWorkout()">Export Exercise Summary</button>
    </div>

<!-- PAGE 5: WORKOUT HISTORY -->
<div id="page-5" class="page">
    <div class="header-flex">
        <h2>Workout History</h2>
        <button class="secondary" style="width: auto; padding: 8px 12px; margin: 0;" onclick="goToPage(1)">Back</button>
    </div>
    <div id="history-list" style="margin-top: 15px;">
        <p style="color: #aaa; text-align: center;">No completed workout history yet.</p>
    </div>
</div>

<!-- PAGE 6: EXERCISE PROGRESS GRAPH -->
<div id="page-6" class="page">
    <div class="header-flex">
        <h2>Exercise Progress</h2>
        <button class="secondary" style="width: auto; padding: 8px 12px; margin: 0;" onclick="goToPage(1)">Back</button>
    </div>
    
    <label>Select Exercise</label>
    <select id="progress-exercise-select" onchange="renderExerciseProgressGraph()" style="margin-bottom: 16px;">
        <option value="">-- Choose an exercise --</option>
    </select>

    <div class="card" style="text-align: center;">
        <h3 id="graph-title-text" style="font-size: 16px; margin-bottom: 10px; color: var(--accent-color);">Select an exercise above</h3>
        <div style="position: relative; width: 100%; height: 220px; background: #161616; border-radius: 8px; border: 1px solid #333; overflow: hidden; display: flex; align-items: center; justify-content: center;" id="canvas-container">
            <canvas id="progressCanvas" width="500" height="200" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
        <p id="graph-stats-sub" style="font-size: 13px; color: #aaa; margin-top: 10px;"></p>
    </div>
</div>

<!-- PAGE 7: BODY WEIGHT TRACKER -->
<div id="page-7" class="page">
    <div class="header-flex">
        <h2>Body Weight Tracker</h2>
        <button class="secondary" style="width: auto; padding: 8px 12px; margin: 0;" onclick="goToPage(1)">Back</button>
    </div>

    <div class="card">
        <label>Date</label>
        <input type="date" id="bw-date">
        <label>Body Weight (kg)</label>
        <input type="number" id="bw-value" step="0.1" placeholder="e.g., 75.5">
        <button onclick="saveBodyWeight()">Log Weight</button>
    </div>

    <h3>Weight History</h3>
    <div id="bw-history-list">
        <p style="color: #aaa; text-align: center;">No body weight history recorded yet.</p>
    </div>
</div>

<script>
    let workouts = JSON.parse(localStorage.getItem('grizzly_workouts')) || [];
    let currentEditingId = null;
    let selectedWorkoutForSession = null;

function goToPage(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageNum).classList.add('active');
        
        if (pageNum === 2) renderWorkoutList();
        if (pageNum === 4) renderActiveWorkoutSelection();
        if (pageNum === 5) renderHistory();
        if (pageNum === 6) initProgressPage();
        if (pageNum === 7) initBodyWeightPage();
    }

    // PAGE 2 & 3: MANAGE WORKOUTS
    function renderWorkoutList() {
        const container = document.getElementById('workout-list');
        if (workouts.length === 0) {
            container.innerHTML = '<p style="color: #777; text-align: center; margin-top: 20px;">No workouts created yet.</p>';
            return;
        }
        container.innerHTML = workouts.map((w, index) => `
            <div class="card">
                <h3>${w.name}</h3>
                <p style="color: #aaa; font-size: 14px; margin-bottom: 10px;">${w.exercises.length} Exercises</p>
                <div class="row">
                    <button class="secondary" onclick="openEditor(${index})" style="margin:0;">Edit</button>
                    <button class="danger" onclick="deleteWorkout(${index})" style="margin:0;">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function openEditor(index) {
        currentEditingId = index;
        document.getElementById('exercise-inputs-container').innerHTML = '';
        
        if (index !== null) {
            document.getElementById('editor-title').innerText = 'Edit Workout';
            document.getElementById('workout-name-input').value = workouts[index].name;
            workouts[index].exercises.forEach(ex => addExerciseInput(ex.name, ex.sets, ex.reps));
        } else {
            document.getElementById('editor-title').innerText = 'Create Workout';
            document.getElementById('workout-name-input').value = '';
            addExerciseInput(); // Add one default row
        }
        goToPage(3);
    }

    function addExerciseInput(name = '', sets = 3, reps = 10) {
        const container = document.getElementById('exercise-inputs-container');
        if (container.children.length >= 10) {
            alert('Maximum 10 exercises allowed.');
            return;
        }
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <label>Exercise Name</label>
            <input type="text" class="ex-name" value="${name}" placeholder="e.g., Bench Press">
            <div class="row">
                <div>
                    <label>Target Sets</label>
                    <input type="number" class="ex-sets" value="${sets}" min="1" max="10">
                </div>
                <div>
                    <label>Target Reps</label>
                    <input type="number" class="ex-reps" value="${reps}" min="1" max="100">
                </div>
            </div>
            <button class="danger" style="margin-top: 8px; padding: 6px;" onclick="this.parentElement.remove()">Remove Exercise</button>
        `;
        container.appendChild(div);
    }

    function saveWorkout() {
        const name = document.getElementById('workout-name-input').value.trim();
        if (!name) { alert('Please enter a workout name.'); return; }
        
        const exerciseCards = document.querySelectorAll('#exercise-inputs-container .card');
        if (exerciseCards.length === 0) { alert('Add at least one exercise.'); return; }

        let exercises = [];
        exerciseCards.forEach(card => {
            exercises.push({
                name: card.querySelector('.ex-name').value.trim() || 'Unnamed Exercise',
                sets: parseInt(card.querySelector('.ex-sets').value) || 3,
                reps: parseInt(card.querySelector('.ex-reps').value) || 10
            });
        });

        if (currentEditingId !== null) {
            workouts[currentEditingId] = { name, exercises };
        } else {
            workouts.push({ name, exercises });
        }

        localStorage.setItem('grizzly_workouts', JSON.stringify(workouts));
        goToPage(2);
    }

    function deleteWorkout(index) {
        if (confirm('Are you sure you want to delete this workout?')) {
            workouts.splice(index, 1);
            localStorage.setItem('grizzly_workouts', JSON.stringify(workouts));
            renderWorkoutList();
        }
    }

    // PAGE 4: ACTIVE SESSION
    function renderActiveWorkoutSelection() {
        const container = document.getElementById('page-4');
        if (workouts.length === 0) {
            container.innerHTML = '<h2>No Workouts Found</h2><p>Please create a workout first.</p><button class="secondary" onclick="goToPage(1)">Back</button>';
            return;
        }

        // If no workout selected yet, let user pick one
        if (!selectedWorkoutForSession) {
            let html = '<div class="header-flex"><h2>Select Workout</h2><button class="secondary" style="width:auto; padding:8px 12px; margin:0;" onclick="goToPage(1)">Home</button></div>';
            workouts.forEach((w, idx) => {
                html += `<button onclick="startSession(${idx})">${w.name}</button>`;
            });
            container.innerHTML = html;
            return;
        }

        // Render Active Session UI
        let w = selectedWorkoutForSession;
        let today = new Date().toISOString().split('T')[0];
        
        let html = `
            <div class="header-flex">
                <h2 id="active-workout-title">${w.name}</h2>
                <button class="secondary" style="width: auto; padding: 6px 10px; margin: 0;" onclick="selectedWorkoutForSession=null; renderActiveWorkoutSelection();">Change</button>
            </div>
            
            <label>Date</label>
            <input type="date" id="session-date" value="${today}">
            <div id="session-exercises">
        `;

w.exercises.forEach((ex, exIdx) => {
            html += `<div class="card">
                <h3>${exIdx + 1}. ${ex.name}</h3>`;
            
            for (let s = 1; s <= ex.sets; s++) {
                // Look up what was lifted last time for this exact set!
                let lastLift = getLastSessionData(ex.name, s);
                let lastLiftText = lastLift ? `<span style="color: var(--accent-color); font-size: 12px; float: right;">Last: ${lastLift}</span>` : '';

                html += `
                    <div class="set-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span class="badge">Set ${s}</span>
                            ${lastLiftText}
                        </div>
                        <div class="row">
                            <input type="number" placeholder="Weight (kg)" class="set-weight" data-ex="${exIdx}" data-set="${s}" style="margin:0;">
                            <input type="number" placeholder="Reps" class="set-reps" data-ex="${exIdx}" data-set="${s}" style="margin:0;">
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        });

        html += `
            <label>Notes</label>
            <textarea id="session-notes" rows="3" placeholder="Notes on performance, energy, etc..."></textarea>
            <button onclick="exportWorkout()">Export Exercise Summary</button>
        `;
        container.innerHTML = html;
    }

    function startSession(index) {
        selectedWorkoutForSession = workouts[index];
        renderActiveWorkoutSelection();
    }

function exportWorkout() {
        let w = selectedWorkoutForSession;
        let date = document.getElementById('session-date').value;
        let notes = document.getElementById('session-notes').value;

        let output = `🏋️ **${w.name}** - ${date}\n`;
        let exercisesCompleted = [];
        let rawExerciseData = []; // Structured data for history lookup
        
        w.exercises.forEach((ex, exIdx) => {
            output += `\n${exIdx + 1}. ${ex.name}/\n`;
            let exHistoryString = `<strong>${ex.name}</strong><br>`;
            let setRecords = [];
            
            for (let s = 1; s <= ex.sets; s++) {
                let weightInput = document.querySelector(`.set-weight[data-ex="${exIdx}"][data-set="${s}"]`);
                let repsInput = document.querySelector(`.set-reps[data-ex="${exIdx}"][data-set="${s}"]`);
                let wVal = weightInput && weightInput.value ? weightInput.value : '0';
                let rVal = repsInput && repsInput.value ? repsInput.value : '0';
                
                output += `  (Set #${s}: ${wVal}kg / ${rVal}reps)\n`;
                exHistoryString += `&nbsp;&nbsp;Set ${s}: ${wVal}kg / ${rVal}reps<br>`;
                setRecords.push({ setNum: s, weight: wVal, reps: rVal });
            }
            exercisesCompleted.push(exHistoryString);
            rawExerciseData.push({ name: ex.name, sets: setRecords });
        });

        if (notes) {
            output += `\nNotes: ${notes}`;
        }

        // Save session with raw data
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        history.unshift({
            date: date,
            name: w.name,
            exercises: exercisesCompleted,
            rawExercises: rawExerciseData
        });
        localStorage.setItem('workoutHistory', JSON.stringify(history));

        // Copy to clipboard
        navigator.clipboard.writeText(output).then(() => {
            alert('Workout summary copied & saved to history!');
            goToPage(1);
        }).catch(err => {
            console.error('Failed to copy', err);
            prompt('Copy your workout summary below:', output);
            goToPage(1);
        });
    }

// Function to save a completed workout to history
function saveWorkoutHistory(workoutName, exercisesCompleted) {
    let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
    
    const session = {
        date: new Date().toLocaleDateString(),
        name: workoutName,
        exercises: exercisesCompleted
    };
    
    history.unshift(session); // Add to the top of the list
    localStorage.setItem('workoutHistory', JSON.stringify(history));
    renderHistory();
}

// Function to render workout history on Page 5, grouped by name
function renderHistory() {
    const historyList = document.getElementById('history-list');
    let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
    
    if (history.length === 0) {
        historyList.innerHTML = '<p style="color: #aaa; text-align: center;">No completed workout history yet.</p>';
        return;
    }
    
    let html = '';
    history.forEach(session => {
        html += `
            <div style="background: #252525; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333;">
                <div style="display: flex; justify-content: space-between; color: var(--accent-color); font-weight: bold; margin-bottom: 5px;">
                    <span>${session.name}</span>
                    <span style="color: #aaa; font-size: 13px;">${session.date}</span>
                </div>
                <div style="color: #ddd; font-size: 14px;">
                    ${session.exercises.join('<br>')}
                </div>
            </div>
        `;
    });
    historyList.innerHTML = html;
}

// Automatically load history when Page 5 opens
// (Make sure to call renderHistory() when navigating to page 5)
</script>
<script>
// Function to export localStorage to a downloadable JSON file
function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "grizzly-gains-backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// Function to import data back into localStorage from a backup file
function importData(event) {
    const fileReader = new FileReader();
    fileReader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            Object.keys(importedData).forEach(key => {
                localStorage.setItem(key, importedData[key]);
            });
            alert("Workouts successfully imported! Refreshing app...");
            location.reload();
        } catch (error) {
            alert("Invalid backup file.");
        }
    };
    fileReader.readAsText(event.target.files[0]);
}

function getLastSessionData(exerciseName, targetSetNum) {
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        for (let session of history) {
            if (session.rawExercises) {
                for (let ex of session.rawExercises) {
                    if (ex.name.toLowerCase() === exerciseName.toLowerCase()) {
                        let matchedSet = ex.sets.find(s => s.setNum === targetSetNum);
                        if (matchedSet) {
                            return `${matchedSet.weight}kg × ${matchedSet.reps}r`;
                        }
                    }
                }
            }
        }
        return null; // No history found yet
    }

// Populate dropdown with unique exercises found in history
    function initProgressPage() {
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        let exerciseSet = new Set();

        history.forEach(session => {
            if (session.rawExercises) {
                session.rawExercises.forEach(ex => {
                    if (ex.name) exerciseSet.add(ex.name);
                });
            }
        });

        let select = document.getElementById('progress-exercise-select');
        let optionsHtml = '<option value="">-- Choose an exercise --</option>';
        
        Array.from(exerciseSet).sort().forEach(exName => {
            optionsHtml += `<option value="${exName}">${exName}</option>`;
        });
        select.innerHTML = optionsHtml;

        // Clear graph on load
        clearProgressCanvas("Select an exercise above to view progress");
    }

    function clearProgressCanvas(message) {
        let canvas = document.getElementById('progressCanvas');
        let ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('graph-title-text').innerText = message;
        document.getElementById('graph-stats-sub').innerText = '';
    }

    // Filter and draw line graph using HTML5 Canvas
    function renderExerciseProgressGraph() {
        let exerciseName = document.getElementById('progress-exercise-select').value;
        if (!exerciseName) {
            clearProgressCanvas("Select an exercise above to view progress");
            return;
        }

        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        let dataPoints = [];

        // Loop through history chronologically (oldest to newest for graphs)
        for (let i = history.length - 1; i >= 0; i--) {
            let session = history[i];
            if (session.rawExercises) {
                let foundEx = session.rawExercises.find(ex => ex.name.toLowerCase() === exerciseName.toLowerCase());
                if (foundEx) {
                    // Find max weight lifted in this session for this exercise
                    let maxWeight = 0;
                    foundEx.sets.forEach(s => {
                        let w = parseFloat(s.weight) || 0;
                        if (w > maxWeight) maxWeight = w;
                    });
                    
                    if (maxWeight > 0) {
                        dataPoints.push({
                            date: session.date,
                            weight: maxWeight
                        });
                    }
                }
            }
        }

        let canvas = document.getElementById('progressCanvas');
        let ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (dataPoints.length === 0) {
            clearProgressCanvas(`No weight logged yet for ${exerciseName}`);
            return;
        }

        document.getElementById('graph-title-text').innerText = `${exerciseName} (Max Weight per Session)`;
        document.getElementById('graph-stats-sub').innerText = `Total Sessions Logged: ${dataPoints.length} | Peak: ${Math.max(...dataPoints.map(d => d.weight))} kg`;

        // Canvas mapping calculations
        let padding = 35;
        let width = canvas.width;
        let height = canvas.height;
        let graphWidth = width - (padding * 2);
        let graphHeight = height - (padding * 2);

        let weights = dataPoints.map(d => d.weight);
        let minW = Math.min(...weights);
        let maxW = Math.max(...weights);
        let weightRange = maxW - minW || 1;
        
        // Add padding margin to Y axis bounds
        let yMin = Math.max(0, minW - (weightRange * 0.1 || 5));
        let yMax = maxW + (weightRange * 0.1 || 5);

        // Draw axes lines
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, height - padding);
        ctx.lineTo(width - padding, height - padding);
        ctx.stroke();

        // Plot data points & connect lines
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 3;
        ctx.beginPath();

        let coords = [];
        dataPoints.forEach((pt, idx) => {
            let x = padding + (idx / (dataPoints.length === 1 ? 1 : dataPoints.length - 1)) * graphWidth;
            let y = (height - padding) - ((pt.weight - yMin) / (yMax - yMin)) * graphHeight;
            coords.push({ x, y, weight: pt.weight, date: pt.date });

            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Draw data dots and labels
        coords.forEach(c => {
            // Dot circle
            ctx.fillStyle = '#121212';
            ctx.strokeStyle = '#ff9800';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Text weight label above dot
            ctx.fillStyle = '#e0e0e0';
            ctx.font = '10px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(`${c.weight}kg`, c.x, c.y - 8);
        });
    }

// Initialize Body Weight Page
    function initBodyWeightPage() {
        // Default date input to today
        document.getElementById('bw-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('bw-value').value = '';
        renderBodyWeightHistory();
    }

    // Save a body weight entry
    function saveBodyWeight() {
        let date = document.getElementById('bw-date').value;
        let weight = parseFloat(document.getElementById('bw-value').value);

        if (!date ||isNaN(weight) || weight <= 0) {
            alert('Please enter a valid date and body weight.');
            return;
        }

        let bwHistory = JSON.parse(localStorage.getItem('bodyWeightHistory')) || [];
        bwHistory.unshift({ date, weight }); // Add to top of list
        localStorage.setItem('bodyWeightHistory', JSON.stringify(bwHistory));

        document.getElementById('bw-value').value = '';
        renderBodyWeightHistory();
        alert('Body weight logged successfully!');
    }

    // Render body weight history list
    function renderBodyWeightHistory() {
        let bwHistory = JSON.parse(localStorage.getItem('bodyWeightHistory')) || [];
        let container = document.getElementById('bw-history-list');

        if (bwHistory.length === 0) {
            container.innerHTML = '<p style="color: #aaa; text-align: center;">No body weight history recorded yet.</p>';
            return;
        }

        let html = '';
        bwHistory.forEach((entry, index) => {
            html += `
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px;">
                    <div>
                        <span style="color: var(--accent-color); font-weight: bold; font-size: 16px;">${entry.weight} kg</span>
                        <div style="color: #aaa; font-size: 12px; margin-top: 2px;">${entry.date}</div>
                    </div>
                    <button class="danger" style="width: auto; padding: 6px 10px; margin: 0; font-size: 12px;" onclick="deleteBodyWeight(${index})">Delete</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // Delete a body weight entry
    function deleteBodyWeight(index) {
        if (confirm('Are you sure you want to delete this entry?')) {
            let bwHistory = JSON.parse(localStorage.getItem('bodyWeightHistory')) || [];
            bwHistory.splice(index, 1);
            localStorage.setItem('bodyWeightHistory', JSON.stringify(bwHistory));
            renderBodyWeightHistory();
        }
    }
</script>
</body>
</html>
